name = "iaut-bot"
main = "src/index.js"
compatibility_date = "2025-01-01"

[[d1_databases]]
binding = "DB"
database_name = "iaut-db"
database_id = "REPLACE_ME"

[vars]
OWNER_ID = "REDACTED_OWNER_ID"
# کانال خصوصی جزوه‌ها (ربات باید ادمین کانال با اجازه‌ی ارسال باشه)
JOZVE_CHANNEL = "-1004434418889"
# نام کاربری عمومی کانال (بدون @) برای ساخت لینک پست‌ها در منوی پیوی
JOZVE_PUBLIC_USERNAME = "iautcloud"
# لینک درخواست عضویت گروه (تأیید دستی ادمین‌ها) برای دکمه‌ی پیوی
GROUP_JOIN_LINK = "https://t.me/+REDACTED_GROUP_LINK"

[triggers]
# ۲۰:۳۰ UTC = ۰۰:۰۰ تهران (پشتیبان) · ۱۶:۳۰ UTC = ۲۰:۰۰ (یادآوری فردا) · ۰۴:۳۰ UTC = ۰۸:۰۰ (یادآوری امروز) · ۰۲:۳۰ UTC = ۰۶:۰۰ (ارسال پست‌های خواب)
# * * * * * = پاک‌کردن پیام‌های موقت /metro (هر دقیقه)
crons = ["30 20 * * *", "30 2 * * *", "* * * * *"]

# لاگ‌های Worker توی داشبورد Cloudflare (Observability). بدون این بلاک، هر deploy تنظیم داشبورد رو برمی‌گردونه.
[observability]
enabled = true

[observability.logs]
enabled = true
invocation_logs = true
persist = true
