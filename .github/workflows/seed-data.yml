name: seed-data

# اجرای دستی یک‌باره: داده‌های اولیه فقط وقتی جدول‌ها خالی هستن وارد می‌شن
on:
  workflow_dispatch:

jobs:
  seed:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    defaults:
      run:
        working-directory: worker
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: c222c6e6cea3c9a98481e1f06079fd5d
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install wrangler
        run: npm install --no-save wrangler@3
      - name: Set database id
        run: |
          DB_ID=$(npx wrangler d1 list --json | node -e '
            let s=""; process.stdin.on("data",d=>s+=d).on("end",()=>{
              const db = JSON.parse(s).find(x => x.name === "iaut-db");
              process.stdout.write(db.uuid);
            });')
          sed -i "s/REPLACE_ME/$DB_ID/" wrangler.toml
      - name: Seed initial data
        run: npx wrangler d1 execute iaut-db --remote --file=seed/initial.sql
