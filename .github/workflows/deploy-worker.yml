name: deploy-worker

on:
  push:
    branches: [main]
    paths:
      - "worker/**"
      - ".github/workflows/deploy-worker.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: worker
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: REDACTED_ACCOUNT_ID
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install wrangler
        run: npm install --no-save wrangler@3

      - name: Ensure D1 database exists and read its id
        run: |
          if ! npx wrangler d1 list --json | grep -q '"iaut-db"'; then
            npx wrangler d1 create iaut-db
          fi
          DB_ID=$(npx wrangler d1 list --json | node -e '
            let s=""; process.stdin.on("data",d=>s+=d).on("end",()=>{
              const list = JSON.parse(s);
              const db = list.find(x => x.name === "iaut-db");
              process.stdout.write(db.uuid);
            });')
          sed -i "s/REPLACE_ME/$DB_ID/" wrangler.toml
          echo "DB id set"

      - name: Apply schema
        run: npx wrangler d1 execute iaut-db --remote --file=schema.sql

      - name: Set ingest secret
        env:
          INGEST_SECRET: ${{ secrets.INGEST_SECRET }}
        run: printf "%s" "$INGEST_SECRET" | npx wrangler secret put INGEST_SECRET

      - name: Set bot token secret
        run: printf "%s" "$TELEGRAM_BOT_TOKEN" | npx wrangler secret put TELEGRAM_BOT_TOKEN

      - name: Set GitHub dispatch token (optional, for /scrape)
        env:
          GH_DISPATCH_TOKEN: ${{ secrets.GH_DISPATCH_TOKEN }}
        run: |
          if [ -n "$GH_DISPATCH_TOKEN" ]; then
            printf "%s" "$GH_DISPATCH_TOKEN" | npx wrangler secret put GH_DISPATCH_TOKEN
          else
            echo "GH_DISPATCH_TOKEN not set; /scrape will report it is not configured."
          fi

      - name: Deploy worker
        run: npx wrangler deploy

      - name: Register Telegram webhook
        run: |
          SECRET=$(printf "hook:%s" "$TELEGRAM_BOT_TOKEN" | sha256sum | cut -c1-48)
          curl -s -X POST "https://api.telegram.org/bot$TELEGRAM_BOT_TOKEN/setWebhook" \
            -d "url=https://iaut-bot.rimon24288.workers.dev/tg-webhook" \
            -d "secret_token=$SECRET" \
            -d "allowed_updates=[\"message\",\"callback_query\",\"channel_post\"]" \
            -d "drop_pending_updates=true" | sed 's/"ok":true.*/webhook ok/' ; echo
