name: deploy-worker

on:
  workflow_dispatch:
    inputs:
      confirm_production_deploy:
        description: "Confirm production Worker/D1/secrets deployment and Telegram webhook registration"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  deploy:
    if: ${{ inputs.confirm_production_deploy }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: worker
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install wrangler
        run: npm install --no-save wrangler@3

      - name: Ensure D1 database exists and read its id
        run: |
          if ! npx wrangler d1 list --json | grep -q '"iaut-db"'; then
            npx wrangler d1 create iaut-db
          fi
          DB_ID=$(npx wrangler d1 list --json | node -e '
            let s=""; process.stdin.on("data",d=>s+=d).on("end",()=>{
              const list = JSON.parse(s);
              const db = list.find(x => x.name === "iaut-db");
              process.stdout.write(db.uuid);
            });')
          sed -i "s/REPLACE_ME/$DB_ID/" wrangler.toml
          echo "DB id set"

      - name: Apply schema
        run: npx wrangler d1 execute iaut-db --remote --file=schema.sql

      - name: Set ingest secret
        env:
          INGEST_SECRET: ${{ secrets.INGEST_SECRET }}
        run: printf "%s" "$INGEST_SECRET" | npx wrangler secret put INGEST_SECRET

      - name: Set bot token secret
        run: printf "%s" "$TELEGRAM_BOT_TOKEN" | npx wrangler secret put TELEGRAM_BOT_TOKEN

      - name: Set group join link secret
        env:
          GROUP_JOIN_LINK: ${{ secrets.GROUP_JOIN_LINK }}
        run: printf "%s" "$GROUP_JOIN_LINK" | npx wrangler secret put GROUP_JOIN_LINK

      - name: Set owner id secret
        env:
          OWNER_ID: ${{ secrets.OWNER_ID }}
        run: printf "%s" "$OWNER_ID" | npx wrangler secret put OWNER_ID

      - name: Deploy worker
        run: npx wrangler deploy

      - name: Register Telegram webhook
        run: |
          set -e
          URL="https://iaut-bot.rimon24288.workers.dev/tg-webhook"
          SECRET=$(printf "hook:%s" "$TELEGRAM_BOT_TOKEN" | sha256sum | cut -c1-48)
          # خطای HTTP یا ok:false باید deploy رو قرمز کنه (قبلاً sed همیشه موفق برمی‌گردوند)
          RESP=$(curl -sS -f -X POST "https://api.telegram.org/bot$TELEGRAM_BOT_TOKEN/setWebhook" \
            -d "url=$URL" \
            -d "secret_token=$SECRET" \
            -d "allowed_updates=[\"message\",\"callback_query\",\"channel_post\"]" \
            -d "drop_pending_updates=false")
          echo "$RESP" | grep -q '"ok":true' || { echo "setWebhook failed"; exit 1; }
          # تأیید بعد از ثبت: آدرس webhook همون باشه
          INFO=$(curl -sS -f "https://api.telegram.org/bot$TELEGRAM_BOT_TOKEN/getWebhookInfo")
          echo "$INFO" | grep -q "\"url\":\"$URL\"" || { echo "webhook url mismatch"; exit 1; }
          if echo "$INFO" | grep -q '"last_error_message"'; then echo "warning: Telegram reports a recent webhook error"; fi
          echo "webhook verified"
