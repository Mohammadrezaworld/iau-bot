name: scrape-bale

on:
  # زمان‌بندی بله از cron-job.org انجام می‌شه (هر ۳۰ دقیقه، با رعایت ساعت سکوت در اسکریپت).
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}

      - name: Install dependencies
        run: |
          pip install playwright httpx
          python -m playwright install chromium
          python -m playwright install-deps chromium

      - name: Scrape Bale channels
        working-directory: scripts
        env:
          INGEST_SECRET: ${{ secrets.INGEST_SECRET }}
        run: python scrape_bale.py

      - name: Report failure to worker
        if: failure()
        env:
          INGEST_SECRET: ${{ secrets.INGEST_SECRET }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          PAYLOAD=$(python3 -c 'import json,os; print(json.dumps({"source":"bale","channel":"","stage":"workflow","message":"اجرای ناموفق: "+os.environ["RUN_URL"]}))')
          curl -s -m 20 -o /dev/null -X POST "https://iaut-bot.rimon24288.workers.dev/scrape-report" \
            -H "x-ingest-secret: $INGEST_SECRET" -H "content-type: application/json" -d "$PAYLOAD" || true
