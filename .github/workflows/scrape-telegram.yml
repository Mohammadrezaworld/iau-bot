name: scrape-telegram

on:
  schedule:
    # ساعت سکوت ۰۲ تا ۰۶ تهران (۲۲:۳۰ تا ۰۲:۳۰ UTC) اجرا نمی‌شه
    - cron: "*/20 3-21 * * *"
    - cron: "0 22 * * *"
    - cron: "20 22 * * *"
    - cron: "40 2 * * *"
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install httpx beautifulsoup4

      - name: Scrape Telegram channels
        working-directory: scripts
        env:
          INGEST_SECRET: ${{ secrets.INGEST_SECRET }}
        run: python scrape_telegram.py
