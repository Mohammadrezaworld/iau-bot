name: scrape-telegram

on:
  # زمان‌بندی از Worker انجام می‌شه (کرون Cloudflare، با رعایت ساعت سکوت)؛
  # زمان‌بند GitHub نامنظم بود، پس اینجا فقط اجرای دستی/فراخوانی Worker مونده.
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install httpx beautifulsoup4

      - name: Scrape Telegram channels
        working-directory: scripts
        env:
          INGEST_SECRET: ${{ secrets.INGEST_SECRET }}
        run: python scrape_telegram.py
