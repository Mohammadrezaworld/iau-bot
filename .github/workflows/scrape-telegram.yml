name: scrape-telegram

on:
  # زمان‌بندی از cron-job.org (هر ۳۰ دقیقه) انجام می‌شه؛ ساعت سکوت هم همان‌جا کنترل می‌شه.
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install httpx beautifulsoup4

      - name: Scrape Telegram channels
        working-directory: scripts
        env:
          INGEST_SECRET: ${{ secrets.INGEST_SECRET }}
        run: python scrape_telegram.py

      - name: Report failure to worker
        if: failure()
        env:
          INGEST_SECRET: ${{ secrets.INGEST_SECRET }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          PAYLOAD=$(python3 -c 'import json,os; print(json.dumps({"source":"telegram","channel":"","stage":"workflow","message":"اجرای ناموفق: "+os.environ["RUN_URL"]}))')
          curl -s -m 20 -o /dev/null -X POST "https://iaut-bot.rimon24288.workers.dev/scrape-report" \
            -H "x-ingest-secret: $INGEST_SECRET" -H "content-type: application/json" -d "$PAYLOAD" || true
